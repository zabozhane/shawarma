# Локальный запуск: docker compose up --build
# Сайт: http://localhost:3000, админка: http://localhost:3000/admin, письма: http://localhost:8025
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://shawarma:shawarma@db:5432/shawarma
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-secret}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-owner}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-shawarma}
      TZ_SHOP: ${TZ_SHOP:-Europe/Moscow}
      # Локально письма уходят в Mailpit, их видно на http://localhost:8025
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Шаурма <no-reply@localhost>}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shawarma
      POSTGRES_PASSWORD: shawarma
      POSTGRES_DB: shawarma
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shawarma"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  db-data:
